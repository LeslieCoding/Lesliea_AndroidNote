// Shared configuration for Android library modules.
import org.gradle.api.artifacts.VersionCatalogsExtension

def catalogs = rootProject.extensions.getByType(VersionCatalogsExtension)
def vlibs = catalogs.find("libs").get()

android {
    // "import" is a Java keyword, so feature-import maps to package feature.importer.
    namespace = "com.leslie.colorosnote." + project.name.replace('-', '.').replace('.import', '.importer')
    compileSdk = 34

    defaultConfig {
        minSdk = 28
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }
}

dependencies {
    testImplementation vlibs.findLibrary("junit").get()
}
