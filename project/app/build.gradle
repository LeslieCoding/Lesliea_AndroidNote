android {
    namespace = "com.leslie.colorosnote"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.leslie.colorosnote"
        minSdk = 28
        targetSdk = 34
        versionCode = 76
        versionName = "3.2.9"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary = true }
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile = rootProject.file(props["storeFile"])
                storePassword = props["storePassword"]
                keyAlias = props["keyAlias"]
                keyPassword = props["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            shrinkResources = false
            // Own package id so a debug build installs *alongside* the signed
            // release app instead of replacing it. On-device acceptance runs
            // (zoom, latency, tearing) then happen in a throwaway install with
            // its own data directory, and the user's real notes are never at
            // risk from a test build. No FileProvider authority in this project
            // is derived from the application id, so the suffix is inert.
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            // ML Kit / Vosk ship .so for x86, x86_64, mips, mips64 and armeabi as well.
            // ColorOS tablets are arm64 (32-bit ARM kept for safety); the rest is ~63 MB of
            // dead weight. Debug keeps every ABI so x86_64 emulators still work.
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        // The app module uses no generated bindings of its own; leaving
        // viewBinding off avoids AGP re-generating library-layout bindings
        // (e.g. FragmentEditorBinding) against the non-transitive app R class.
        viewBinding = false
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt",
                         "META-INF/NOTICE", "META-INF/NOTICE.txt", "META-INF/ASL2.0",
                         "META-INF/*.kotlin_module"]
        }
    }
}

